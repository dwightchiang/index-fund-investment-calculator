name: update-jiucai

# 每天拉几次韭圈儿的十年分位（纳斯达克100 等），写进 data/jiucai.json
#
# 关于时间的实测结论（2026-11-20 核实）：
#   韭圈儿页面顶部的 id-metric-bar（日期+PE+分位）大约 10:00 就更新了，
#   但底部的 id-status-desc 会慢一拍。API 的 detail 接口返回的
#   header.percent / table[市盈率].percent 是**顶部那份**（更新快的），
#   所以只要在 10:00 之后拉，拿到的就是新数据。
#   不过 10:15 偶尔还是会拿到旧的一份，所以多跑几个时间点：
#     11:00 / 12:00 / 13:30 北京时间 = UTC 03:00 / 04:00 / 05:30
#   重复跑不会写坏数据（值相同时不产生 diff，不会提交）。
#   周一到周六跑（周六拿周五的，周一拿上周五的）。

on:
  schedule:
    - cron: "0 3 * * 1-6"      # 11:00
    - cron: "0 4 * * 1-6"      # 12:00
    - cron: "30 5 * * 1-6"     # 13:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取韭圈儿分位
        run: python tools/fetch_jiucai.py --out data/jiucai.json

      - name: 校验数据
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/jiucai.json", encoding="utf-8"))
          items = d.get("items") or {}
          print(f"指数 {len(items)} 个，生成时间 {d.get('generated_at')}")
          for k, v in items.items():
              print(f"  {k} {v.get('name')} PE={v.get('pe')} 分位={v.get('pe_pct')}% 数据日={v.get('date')}")
          if not items:
              sys.exit("❌ 一个都没取到")
          bad = [k for k, v in items.items() if v.get("pe_pct") is None]
          if bad:
              sys.exit(f"❌ 这些没有分位：{bad}")
          print("✅ 数据校验通过")
          PY
          echo "---- 变更文件 ----"
          git status --short

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jiucai.json
          if git diff --staged --quiet; then
            echo "::warning::data/jiucai.json 没有变化（可能非交易日或抓取异常）"
            exit 0
          fi
          git commit -m "chore: 更新韭圈儿十年分位 $(date -u +%Y-%m-%d)"
          git push
