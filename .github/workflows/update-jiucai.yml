name: update-jiucai

# 每天拉一次韭圈儿的十年分位（纳斯达克100 等），写进 data/jiucai.json
# 韭圈儿约 10:00（北京时间）更新前一日数据。
# 定三个时间点兜底（GitHub 的 schedule 在负载高时会延迟甚至跳过某次）：
#   10:15 / 11:00 / 13:30 北京时间 = UTC 02:15 / 03:00 / 05:30
# 脚本内部会判断「数据是否已经是该有的那份」，重复跑不会写坏数据。
# 周一到周六跑（周六拿周五的，周一拿上周五的）。

on:
  schedule:
    - cron: "15 2 * * 1-6"
    - cron: "0 3 * * 1-6"
    - cron: "30 5 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取韭圈儿分位
        run: python tools/fetch_jiucai.py --out data/jiucai.json

      - name: 校验数据
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/jiucai.json", encoding="utf-8"))
          items = d.get("items") or {}
          print(f"指数 {len(items)} 个，生成时间 {d.get('generated_at')}")
          for k, v in items.items():
              print(f"  {k} {v.get('name')} PE={v.get('pe')} 分位={v.get('pe_pct')}% 数据日={v.get('date')}")
          if not items:
              sys.exit("❌ 一个都没取到")
          bad = [k for k, v in items.items() if v.get("pe_pct") is None]
          if bad:
              sys.exit(f"❌ 这些没有分位：{bad}")
          print("✅ 数据校验通过")
          PY
          echo "---- 变更文件 ----"
          git status --short

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jiucai.json
          if git diff --staged --quiet; then
            echo "::warning::data/jiucai.json 没有变化（可能非交易日或抓取异常）"
            exit 0
          fi
          git commit -m "chore: 更新韭圈儿十年分位 $(date -u +%Y-%m-%d)"
          git push
